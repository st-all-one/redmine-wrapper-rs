[package]
name = "redmine-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
description = "CLI para consultas e ações na API REST do Redmine"
publish = false

[[bin]]
name = "redmine"
path = "src/main.rs"

[dependencies]
redmine-wrapper-rs = { path = "../..", default-features = false, features = ["rustls"] }
clap = { version = "4", features = ["derive", "env"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
wiremock = "0.6"

[lints]
workspace = true
