[workspace]
members = ["crates/redmine-cli"]
# Edition 2024 usa o resolver v3 por padrão (MSRV-aware); declarado para ficar explícito.
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "deny"
unused_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "warn"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
noop_method_call = "deny"
unused_import_braces = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.cargo]
# Cargo 1.100: dependência declarada e nunca usada é erro de rigor.
unused_dependencies = "deny"
# Cargo 1.100: homepage == repository é ruído no manifesto.
redundant_homepage = "deny"

[workspace.lints.clippy]
# Grupos (prioridade menor para permitir overrides pontuais).
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

unwrap_used = "deny"

# Ruidosas: abrimos mão (documentado no AGENTS.md §Lints).
module_name_repetitions = "allow"
must_use_candidate = "allow"
implicit_hasher = "allow"
multiple_crate_versions = "allow"
min_ident_chars = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
excessive_nesting = "allow"
# Clippy 1.100 (MSRV 1.100): `assert!(x.is_empty())` é o idioma do projeto em testes;
# a sugestão (`assert_eq!(x, [] as [T; 0])`) é pior.
assert_is_empty = "allow"

[package]
name = "redmine-wrapper-rs"
version = "0.2.0"
edition = "2024"
# MSRV é contrato: casa com rust-toolchain.toml e clippy.toml::msrv.
rust-version = "1.100"
license = "MPL-2.0"
description = "Wrapper Rust tipado para a API REST do Redmine"
repository = "https://github.com/st-all-one/redmine-wrapper-rs"
keywords = ["redmine", "api", "rest", "wrapper"]
categories = ["api-bindings"]

[lib]
name = "redmine_wrapper"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
