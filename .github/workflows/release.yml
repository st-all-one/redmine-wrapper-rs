# Release — binários otimizados do CLI `redmine` por plataforma, publicados a
# partir de uma tag `vX.Y.Z`.
#
# SEM Docker: cada alvo é compilado no runner nativo da sua arquitetura (Linux
# x86_64, Linux ARM64, macOS arm64 com cross para x86_64, Windows x86_64 com
# cross para ARM64).
#
# Fluxo: `git tag v0.2.0 && git push origin v0.2.0` → verifica versão e testes
# → compila a matriz → publica o GitHub Release com os `.tar.gz`/`.zip` +
# `sha256sums.txt`.
#
# O nome do asset é `redmine-<versão>-<target>.{tar.gz,zip}`; o binário dentro
# do arquivo é `redmine` (ou `redmine.exe` no Windows).
#
# Importante: faça push do commit que adiciona/atualiza este workflow ANTES de
# criar a tag e aguarde o CI iniciar; o GitHub só dispara o evento de tag se já
# conhece o workflow. Se a tag não disparar, use workflow_dispatch com `tag=vX.Y.Z`.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente para publicar (ex.: v0.2.1); vazio = apenas build"
        required: false
        type: string

concurrency:
  # Tag push e workflow_dispatch com a mesma tag compartilham o grupo.
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Portão da versão: o commit tagueado precisa estar verde e a tag precisa
  # casar com as versões da lib e do CLI.
  verify:
    name: verificar versão e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Portão local (fmt + clippy + test + doc)
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo doc --workspace --no-deps --locked

      - name: Tag == versões do workspace
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="${RELEASE_TAG:-}"
          if [[ -z "${tag_ref}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_ref="${GITHUB_REF_NAME}"
          fi
          if [[ -z "${tag_ref}" ]]; then
            echo "workflow_dispatch sem tag: apenas build (sem release)."
            exit 0
          fi
          tag="${tag_ref#v}"
          lib="$(grep -m1 -E '^version = "[0-9]' Cargo.toml | cut -d'"' -f2)"
          cli="$(grep -m1 -E '^version = "[0-9]' crates/redmine-cli/Cargo.toml | cut -d'"' -f2)"
          echo "tag=v${tag}  lib=${lib}  cli=${cli}"
          if [[ "${tag}" != "${lib}" || "${tag}" != "${cli}" ]]; then
            echo "::error::tag v${tag} != lib ${lib} / cli ${cli} — alinhe as versões."
            exit 1
          fi

  # Matriz de binários otimizados (perfil `release`: LTO fat, codegen-units=1, strip).
  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — musl estático (roda em qualquer distro, glibc ou não).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
          # macOS — Apple Silicon nativo + Intel por cross-compile (mesmo SDK).
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          # Windows — MSVC x86_64 nativo + ARM64 por cross-compile.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            msvc_arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # musl: o Rust moderno já linka estático (self-contained); musl-tools cobre o cc.
      - name: Dependências musl (Linux)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Windows ARM64: cross x64→arm64. `amd64_arm64` é o host x64 com alvo ARM64
      # (o valor `arm64` pediria um host ARM64 nativo, inexistente no runner).
      - name: Toolchain MSVC ARM64 (Windows)
        if: matrix.msvc_arch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Verificar linker ARM64
        if: matrix.msvc_arch == 'arm64'
        shell: pwsh
        run: |
          where.exe link
          where.exe cl

      - name: Build release (otimizado)
        run: cargo build --release --locked -p redmine-cli --target ${{ matrix.target }}

      - name: Empacotar
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 -E '^version = "[0-9]' Cargo.toml | cut -d'"' -f2)"
          name="redmine-${version}-${{ matrix.target }}"
          staging="dist/${name}"
          mkdir -p "$staging"

          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
            cp "target/${{ matrix.target }}/release/redmine.exe" "$staging/redmine.exe"
          else
            cp "target/${{ matrix.target }}/release/redmine" "$staging/redmine"
            chmod +x "$staging/redmine"
          fi

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            ( cd "$staging" && 7z a -tzip "../${name}.zip" ./* >/dev/null )
          else
            ( cd "$staging" && tar -czf "../${name}.tar.gz" redmine )
          fi
          ls -l "dist/${name}.${{ matrix.archive }}"

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: redmine-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  # Publica o Release: reúne os artefatos, gera os checksums e anexa tudo.
  release:
    name: publicar
    needs: build
    # Publica quando o gatilho é uma tag; workflow_dispatch só publica se receber `tag`.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums SHA-256
        run: |
          set -euo pipefail
          cd dist
          sha256sum redmine-*.* > sha256sums.txt
          cat sha256sums.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
